<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>For You ♡</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Georgia, "Times New Roman", serif; color: #174a66; overflow-x: hidden; background: linear-gradient( to bottom, #dff8ff 0%, #b9edfa 35%, #74d1e8 70%, #2498ba 100% ); } .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 35px 18px 100px; position: relative; overflow: hidden; } /* soft sunlight */ .sun { position: absolute; width: 180px; height: 180px; top: 35px; right: 35px; border-radius: 50%; background: rgba(255, 255, 230, 0.55); box-shadow: 0 0 70px rgba(255,255,220,0.7); } .card { width: min(92%, 600px); padding: 38px 25px 42px; text-align: center; border-radius: 30px; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(18, 103, 133, 0.25); position: relative; z-index: 5; } .small { font-family: Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; font-size: 12px; color: #3d91aa; margin-bottom: 15px; } h1 { margin: 0; font-size: clamp(42px, 12vw, 72px); color: #167da2; font-weight: normal; } .subtitle { font-size: 20px; margin: 10px 0 25px; color: #39738b; } .message { font-size: 17px; line-height: 1.8; color: #28566b; margin: 20px auto 28px; max-width: 480px; } .wave { font-size: 30px; margin: 10px 0 20px; letter-spacing: 5px; } .player { background: rgba(220, 247, 252, 0.9); border-radius: 22px; padding: 20px 15px; margin-top: 25px; } .song-title { font-family: Arial, sans-serif; font-weight: bold; color: #167da2; font-size: 18px; margin-bottom: 12px; } audio { width: 100%; max-width: 430px; } .bottom { margin-top: 28px; font-size: 14px; color: #5b91a3; font-family: Arial, sans-serif; } /* bubbles */ .bubble { position: absolute; bottom: -80px; border-radius: 50%; background: rgba(255,255,255,0.28); border: 1px solid rgba(255,255,255,0.45); animation: rise linear infinite; } .b1 { width: 25px; height: 25px; left: 8%; animation-duration: 9s; } .b2 { width: 14px; height: 14px; left: 25%; animation-duration: 7s; animation-delay: 2s; } .b3 { width: 38px; height: 38px; left: 68%; animation-duration: 11s; animation-delay: 1s; } .b4 { width: 18px; height: 18px; left: 85%; animation-duration: 8s; animation-delay: 3s; } @keyframes rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-115vh); opacity: 0; } } /* ocean waves */ .ocean { position: absolute; bottom: -5px; left: 0; width: 100%; height: 105px; z-index: 2; } .wave-shape { position: absolute; left: -10%; width: 120%; height: 100px; border-radius: 50% 50% 0 0; background: rgba(255,255,255,0.28); animation: waveMove 7s ease-in-out infinite; } .wave-shape:nth-child(2) { bottom: -25px; opacity: 0.45; animation-duration: 9s; animation-direction: reverse; } @keyframes waveMove { 0%, 100% { transform: translateX(-3%) rotate(1deg); } 50% { transform: translateX(3%) rotate(-1deg); } } </style> </head> <body> <div class="page"> <div class="sun"></div> <div class="bubble b1"></div> <div class="bubble b2"></div> <div class="bubble b3"></div> <div class="bubble b4"></div> <div class="card"> <div class="small">a little something for you</div> <h1>Happy Birthday ♡</h1> <div class="subtitle"> From me, to you </div> <div class="wave"> 🌊 🐚 🫧 </div> <div class="message"> I made this little place just for you. <br><br> I hope this song brings back some beautiful memories and makes your birthday a little more special. 🤍 <br><br> Press play when you're ready... </div> <div class="player"> <div class="song-title"> 🎧 Last Winter </div> <audio controls> <source src="mahla%20Last%20Winter.mp3" type="audio/mpeg"> Your browser does not support audio playback. </audio> </div> <div class="bottom"> Made with love, just for you 🌊🩵 </div> </div> <div class="ocean"> <div class="wave-shape"></div> <div class="wave-shape"></div> </div> </div> </body> </html>
