<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Georgia, "Times New Roman", serif;
        color: #29445c;

        background:
            radial-gradient(circle at 20% 15%, rgba(255,255,255,0.95), transparent 25%),
            radial-gradient(circle at 85% 80%, rgba(255,255,255,0.7), transparent 30%),
            linear-gradient(145deg, #dff4ff, #b9dff2, #dceff7);
    }

    /* soft icy glow */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 50% 45%, rgba(255,255,255,0.35), transparent 45%);
    }

    .snow {
        position: fixed;
        top: -20px;
        color: white;
        font-size: 14px;
        opacity: 0.8;
        pointer-events: none;
        animation: snowfall linear infinite;
        z-index: 1;
    }

    @keyframes snowfall {
        from {
            transform: translateY(-30px) translateX(0) rotate(0deg);
        }

        to {
            transform: translateY(110vh) translateX(35px) rotate(180deg);
        }
    }

    .card {
        position: relative;
        z-index: 5;

        width: min(88%, 520px);
        padding: 42px 30px;

        text-align: center;

        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 28px;

        box-shadow:
            0 20px 50px rgba(67, 116, 145, 0.18),
            inset 0 1px 0 rgba(255,255,255,0.8);

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .small-title {
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: lowercase;
        color: #607f96;
        margin-bottom: 16px;
    }

    h1 {
        margin: 0 0 18px;
        font-size: clamp(32px, 8vw, 48px);
        font-weight: normal;
        color: #294b65;
    }

    .from {
        font-size: 16px;
        color: #6d879a;
        margin-bottom: 25px;
    }

    .snow-symbols {
        font-size: 25px;
        letter-spacing: 8px;
        margin-bottom: 28px;
    }

    .message {
        font-size: 16px;
        line-height: 1.8;
        color: #49677d;
        margin: 0 auto 24px;
        max-width: 420px;
    }

    .message em {
        display: block;
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.8;
        color: #607b8f;
    }

    .play-text {
        font-size: 15px;
        letter-spacing: 0.5px;
        color: #385d75;
        margin-top: 25px;
        margin-bottom: 12px;
    }

    .song {
        font-size: 17px;
        color: #294b65;
        margin-bottom: 18px;
    }

    audio {
        width: 100%;
        max-width: 360px;
        height: 42px;
    }

    .footer {
        margin-top: 25px;
        font-size: 14px;
        color: #6b879b;
    }

    .footer span {
        color: #526f84;
    }

    @media (max-width: 500px) {
        .card {
            padding: 34px 22px;
        }

        .message {
            font-size: 15px;
        }

        .snow-symbols {
            font-size: 22px;
        }
    }
</style>
</head>

<body>

<script>
    const snowflakes = ["❄", "❅", "❆", "🌨", "❄"];

    for (let i = 0; i < 32; i++) {
        const snow = document.createElement("div");

        snow.className = "snow";
        snow.textContent =
            snowflakes[Math.floor(Math.random() * snowflakes.length)];

        snow.style.left = Math.random() * 100 + "vw";
        snow.style.fontSize = (10 + Math.random() * 14) + "px";
        snow.style.animationDuration = (7 + Math.random() * 9) + "s";
        snow.style.animationDelay = (-Math.random() * 12) + "s";
        snow.style.opacity = (0.35 + Math.random() * 0.55);

        document.body.appendChild(snow);
    }
</script>

<div class="card">

    <div class="small-title">
        a little something for you
    </div>

    <h1>
        Happy Birthday ♡
    </h1>

    <div class="from">
        From me, to you
    </div>

    <div class="snow-symbols">
        ❄ 🌨 🤍 🌫
    </div>

    <div class="message">

        I made this little place just for you.

        <em>
            I hope this song brings back some memories of us
            and makes your birthday a little more special. 🤍
        </em>

    </div>

    <div class="play-text">
        Press play when you're ready...
    </div>

    <div class="song">
        🎧 Last Winter
    </div>

    <audio controls>
        <source src="mahla%20Last%20Winter.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="footer">
        Made with love, just for you ❄️🤍
    </div>

</div>

</body>
  </html>
